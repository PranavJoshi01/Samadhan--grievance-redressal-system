version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: grievance_db
    ports:
      - "3307:3306"   # host:container
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: grievance-core-service
    build: .
    container_name: grievance-backend
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/grievance_db   # ✅ FIXED
      DB_USER: root
      DB_PASS: root
      JWT_SECRET: SamadhanSecretKey
    restart: always

volumes:
  mysql_data: